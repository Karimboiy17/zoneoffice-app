<footer id="ft">OFFICE MANAGERS · @zoneofficebot</footer>

<script>
(function(){
  // Deep link: start_param (menyu tugmasi: t.me/zoneofficebot/app?startapp=tasks)
  // yoki ?go=tasks&id=17 (botdagi tugma) -> kerakli sahifani darhol ochadi.
  var OK = {tasks:1, attendance:1, ranking:1, reports:1, admin:1};
  var sec = "", id = "";
  try { var sp = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.start_param) || ""; } catch(e){}
  try {
    var q = new URLSearchParams(location.search || "");
    var raw = (q.get("go") || q.get("startapp") || sp || "").toLowerCase();
    var m = raw.match(/^([a-z]+)[_-]?(\d*)$/);
    if (m) { sec = m[1]; id = m[2] || (q.get("id") || ""); }
    if (!OK[sec]) { sec = ""; id = ""; }
    // rol bo'yicha yopilgan bo'limga kirishga urinish -> bosh sahifada qolamiz
    try {
      var mm = JSON.parse(sessionStorage.getItem("tg_me") || "null");
      if (mm && mm.perms && mm.perms[sec] === false) { sec = ""; id = ""; }
    } catch(e2){}
  } catch(e){}
  if (sec) location.replace("pages/" + sec + ".html" + (id ? "?id=" + encodeURIComponent(id) : ""));
})();
</script>
<script>
(function(){
  // Rol bo'yicha kartalarni yashirish (perms backenddan: /api/webapp/me)
  function applyPerms(p){
    if (!p) return;
    var cs = document.querySelectorAll(".card[data-perm]");
    for (var i = 0; i < cs.length; i++){
      var k = cs[i].getAttribute("data-perm");
      cs[i].style.display = (p[k] === false) ? "none" : "";
    }
  }
  try{
    const me = JSON.parse(sessionStorage.getItem("tg_me") || "null");
    if(me && me.name) document.getElementById("who").textContent = me.name;
    if(me) applyPerms(me.perms);
  }catch(e){}

  const DAYS = ["Yak","Dush","Sesh","Chor","Pay","Jum","Shan"];
  const MON = ["yanv","fevr","mart","apr","may","iyun","iyul","avg","sen","okt","noy","dek"];
  function tick(){
    const d = new Date();
    document.getElementById("ctime").textContent =
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    document.getElementById("cdate").textContent =
      DAYS[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()];
  }
  tick(); setInterval(tick, 15000);

  // Bildirishnoma: o'qilmagan sonlar kafel ustida
  function badges(){
    if (!window.tgJson) return;
    window.tgJson("/api/webapp/me").then(function(j){
      if (!j || !j.ok || !j.counts) return;
      try {
        sessionStorage.setItem("tg_me", JSON.stringify({id:j.id, name:j.name, branch:j.branch,
          manager:j.manager, role:j.role, perms:j.perms || null}));
        applyPerms(j.perms);
        if (j.name) document.getElementById("who").textContent = j.name;
      } catch(e){}
      Object.keys(j.counts).forEach(function(sec){
        var card = document.querySelector(".card[data-sec=\"" + sec + "\"]");
        if (!card) return;
        var n = +j.counts[sec] || 0, b = card.querySelector(".badge");
        if (n > 0) {
          if (!b) { b = document.createElement("span"); b.className = "badge"; card.appendChild(b); }
          b.textContent = n > 99 ? "99+" : String(n);
        } else if (b) { b.parentNode.removeChild(b); }
      });
    }).catch(function(){});
  }
  badges(); setInterval(badges, 60000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) badges(); });

  document.addEventListener("click", function(e){
    const t = e.target.closest(".card");
    if(!t || t.classList.contains("clock")) return;
    t.classList.add("pressed");
    setTimeout(function(){ t.classList.remove("pressed"); }, 180);
  });
})();
</script>
<script>
(function(){try{
 var VER=48, k='tmt_ver';
 fetch('version.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
  if(!j||!j.ver) return;
  var have=+(sessionStorage.getItem(k)||0);
  if(j.ver!==VER && have!==j.ver){sessionStorage.setItem(k,j.ver);location.replace(location.pathname+'?v='+j.ver);}
 }).catch(function(){});
}catch(e){}})();
</script>
